<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>404 · marxistgeek.org</title>
<style>
  :root{--bg:#f6f7f9;--fg:#1b1f24;--muted:#5c6672;--card:#fff;--line:#e3e6ea;--accent:#2f6feb}
  @media (prefers-color-scheme: dark){
    :root{--bg:#0f1115;--fg:#e8eaed;--muted:#9aa4b2;--card:#161a20;--line:#242a33;--accent:#6aa1ff}
  }
  *{box-sizing:border-box}
  body{
    margin:0;min-height:100vh;background:var(--bg);color:var(--fg);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans SC",
                "PingFang SC","Microsoft YaHei",sans-serif;
    display:flex;align-items:center;justify-content:center;padding:24px;text-align:center;
  }
  main{max-width:480px}
  .code{font-size:64px;font-weight:700;letter-spacing:-2px;color:var(--accent);line-height:1}
  h1{font-size:19px;margin:14px 0 0;font-weight:600}
  p{color:var(--muted);font-size:14.5px;margin:12px 0 0}
  a{color:var(--accent);text-decoration:none;font-size:14.5px}
  a:hover{text-decoration:underline}
</style>
</head>
<body>
  <main>
    <div class="code">404</div>
    <h1>这个页面不存在</h1>
    <p>你访问的地址没有对应的内容。</p>
    <p><a href="/">← 返回首页</a></p>
  </main>
</body>
</html>
